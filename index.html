.auth-card label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}
.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px}
.auth-card button{width:100%;margin-top:17px;padding:12px}
.auth-error{color:#a33d3d;font-size:13px;margin-top:12px;min-height:18px}
#syncStatus{font-size:11px;color:#d7e5ef;padding:5px 8px;border:1px solid #ffffff44;border-radius:8px}


/* Postal-blue employee-link picker */
.invite-select{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid #cbd6df;border-radius:10px;background:#f8fafc;color:#17324d;padding:13px 14px;font:inherit;font-weight:600;min-height:52px}.invite-select:focus{outline:2px solid #9cc9ca;outline-offset:2px}.invite-select span{color:#526a7d;font-size:20px}.invite-options{margin-top:7px;border:1px solid #cbd6df;border-radius:10px;overflow:auto;max-height:260px;background:#fff;box-shadow:0 8px 22px #17324d18}.invite-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid #e4eaf0;background:#fff;color:#203344;text-align:left;font:inherit}.invite-option:last-child{border-bottom:0}.invite-option span{font-weight:650}.invite-option small{color:#607487;font-size:13px;font-variant-numeric:tabular-nums}.invite-option.active{background:#eaf2f7;color:#17324d}.invite-option:focus{outline:2px solid #8ab8c4;outline-offset:-2px}

.assignment-modal{position:relative;padding-top:28px}.modal-x{position:absolute;right:14px;top:10px;border:0;background:transparent;color:#526a7d;font-size:30px;line-height:1;padding:4px 8px;border-radius:8px}.modal-x:hover{background:#edf3f7}.assignment-foot{align-items:center}.modal-foot-spacer{flex:1}.btn.danger{background:#fff;border:1px solid #c96b6b;color:#a12f2f}.btn.danger:hover{background:#fff1f1}

.roster-line{display:flex;align-items:center;gap:8px;min-width:0}.roster-rank{flex:0 0 23px;width:23px;height:23px;border:1.5px solid #8da6b8;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#17324d;background:#edf3f7;font-size:12px;font-weight:750;line-height:1}.roster-line .roster-name{flex:1 1 auto;min-width:0;text-align:left}.roster-line .roster-entitlement{flex:0 0 auto;margin-left:auto;min-width:48px;text-align:right;white-space:nowrap}

.board-print-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}.board-print-actions .btn{white-space:nowrap}@media(max-width:700px){.page-head .toolbar.board-print-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.board-print-actions .btn{flex:0 1 auto}}

<script>

const ROSTERS=[
// Main Office Window Clerks — page 1
[["Patterson","1998031402",5],["Bernardino","2008041201",5],["Leaupepe","20221121801",4],["Parker","2023011401",4],["Lambert","2023042201",4],["Savage","2024012701",4],["Ige","2024062901",2],["Riley","2024122801",2],["Aguon","2026103101",2]],
// MOU Distribution Clerks — page 2
[["Beers","2019072001",5],["O'Keefe","2021022701",5],["Richards","2022042301",4],["Leben","2024042001",4],["Corbett","2025022201",2],["Potts","2026101702",2],["Fouts","BIS 12/28",2]],
// EVDCU Tour 1 — page 3
[["Hoglund","2017012101",4],["Henderson","2025012501",2],["Carranza","2025040501",4],["Casci","2025092001",2],["Farnsworth","2026012401",4],["Smythe","2026022101",2],["Delcid","2026101701",2],["Araiza","BIS 05/02",2]],
// Orchards / Cascade Park Retail — page 4
[["Flores","2002111601",5],["Martin M","2006021801",5],["White R","2013082401",5],["Paul","2019083102",4],["Sorenson","2019091401",5],["Gildart","2022052101",4],["Bautista","2022052102",4],["Forbes","2022111201",4],["Royer","2024022401",2]],
// Admin / Downtown Retail — page 5
[["Steglich","1993082101",5],["Castro S","1998021401",5],["Figueras","1998031401",5],["Smith","1999042401",5],["Stockton","2014112902",4],["Melvin","2019083101",4],["Sakamaki","2021120401",4],["Burke","2023072901",4]],
// EVDCU Tour 2 — page 6
[["Brown","2003033101",5],["Malloy","2014090601",5],["Ahn","2014112901",4],["Gaddis","2019060201",5],["Khotchasene","2021061801",4],["Galeai","2023022501",4],["Dove","2023120201",4]],
// Custodians / Maintenance — page 7
[["Padaca M","2018033101",5],["Oneil J","2020010401",5],["McCaleb","2020070401",4],["James","2025062801",4],["Hixson","2025080901",2],["Wonch","2026050201",2]]
];
const seed={year:2027,unionStart:"2027-04-26",unionEnd:"2027-05-02",leaveAvailable:"2027-01-23",weekStart:"Monday",offices:DEFAULT_OFFICES.map((o,i)=>({...o,id:i+1})),employees:ROSTERS.flatMap((rows,i)=>rows.map((r,j)=>({id:`seed-${i+1}-${j+1}`,first:"",last:r[0],seniority:r[1],entitlement:r[2],officeId:i+1,active:true}))),selections:[],round:1,deadlineHours:24,holidays:HOLIDAYS,notes:"Early-year leave may require a balance carried over from the previous year. Employees should verify their available balance."};
let state;try{state=JSON.parse(localStorage.getItem("alBidPrototype"))||structuredClone(seed)}catch(e){state=JSON.parse(JSON.stringify(seed))}
if(!state.employees || state.employees.length===0){state.employees=JSON.parse(JSON.stringify(seed.employees));safeLocalBackup()}
let page="boards",selectedOffice=1;
const SUPABASE_URL="https://ghnuahsovbpyzrjvbylp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_1Z7ddDl3qiL-8LRLhtML8Q_EOyJs6E2";
let supabaseClient=null,cloudReady=false,cloudTimer=null,cloudBusy=false,realtimeChannel=null;
function safeLocalBackup(){
 // Browser storage is optional; Supabase is the authoritative shared copy.
 try{localStorage.setItem("alBidPrototype",JSON.stringify(state));return true}
 catch(err){console.warn("Local backup unavailable; cloud data remains accessible",err);return false}
}
function setSyncStatus(message){const el=document.getElementById("syncStatus");if(el)el.textContent=message}
function save(){
 safeLocalBackup();
 if(!cloudReady||!supabaseClient)return;
 setSyncStatus("Saving…");
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(async()=>{
  if(cloudBusy)return;
  cloudBusy=true;
  try{
   const {error}=await supabaseClient.from("annual_leave_app_state").upsert({id:"main",payload:state},{onConflict:"id"});
   if(error)throw error;
   setSyncStatus("Synced");
  }catch(err){console.error("Cloud save failed",err);setSyncStatus("Sync error");}
  finally{cloudBusy=false;}
 },350);
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateAdd(d,n){let x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x}
function fmt(d){return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(d)}
function weeks(){let out=[],d=new Date(state.year,0,1,12);while(d.getDay()!==1)d.setDate(d.getDate()+1);let n=1;while(d.getFullYear()<=state.year){let e=dateAdd(d.toISOString().slice(0,10),6);out.push({n:n++,start:new Date(d),end:e});d.setDate(d.getDate()+7)}return out}
function christmasBlocked(o){if(o.group==="always")return false;let blocked=(state.year%2===1);return o.group==="A"?blocked:!blocked}
function unionWeek(w){return w.start<=new Date(state.unionEnd+"T23:59:59")&&w.end>=new Date(state.unionStart+"T00:00:00")}
function blocked(o,w){let x=w.start,y=w.end;let christmasStart=new Date(state.year,11,20,12),christmasEnd=new Date(state.year+1,0,3,12);return unionWeek(w)||(christmasBlocked(o)&&x<=christmasEnd&&y>=christmasStart)}
function taken(o,w,exclude){return state.selections.some(s=>s.officeId===o.id&&s.year===state.year&&s.weeks.includes(w.n)&&s.employeeId!==exclude)}
function empOrder(list){return list.slice().sort((a,b)=>a.seniority.localeCompare(b.seniority)||a.last.localeCompare(b.last))}
function setPage(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function head(title,sub,actions=""){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="toolbar">${actions}</div></div>`}
function render(){document.getElementById("topYear").textContent=state.year;const m=document.getElementById("main");({dashboard,boards,employees,calendar,bidding,settings,settingsHub}[page]||boardPage)(m)}
function boardPage(m){
 const office=state.offices.find(o=>o.id===selectedOffice)||state.offices[0];
 const roster=empOrder(state.employees.filter(e=>e.officeId===office.id&&e.active!==false));
 const ws=weeks();
 const rows=ws.map(w=>{let assigned=state.selections.filter(s=>s.officeId===office.id&&s.year===state.year&&s.weeks.includes(w.n));let chips=assigned.map(s=>{let e=state.employees.find(x=>x.id===s.employeeId);return e?`<span class="assigned">${esc(e.last)} <small>R${s.round}</small><button class="edit-assignment" type="button" title="Edit assignment" aria-label="Edit ${esc(e.last)} assignment" onclick="event.stopPropagation();assignWeek(${w.n})">✎</button></span>`:""}).join("");let blockedNow=blocked(office,w);return `<tr><td class="weekcol"><b>${fmt(w.start)} – ${fmt(w.end)}</b></td><td class="week-drop ${blockedNow?'black':''}" data-week="${w.n}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropEmployee(event,${w.n})" onclick="assignWeek(${w.n})">${blockedNow?(unionWeek(w)?'UNION BLACKOUT':'CHRISTMAS BLACKOUT'):chips||'<span class="muted">Tap or drop employee here</span>'}</td></tr>`}).join("");
 m.innerHTML=`<div class="page-head"><div><h2>Annual Leave Board · ${state.year}</h2><p>Choose a board, then choose an employee and assign their weeks.</p></div><div class="toolbar board-print-actions"><button class="btn primary" onclick="printYear()">Print this board</button><button class="btn primary" onclick="shareBoard()">Share this board</button></div></div>
 <div class="simple-tabs">${state.offices.map(o=>`<button class="${o.id===office.id?'active':''}" onclick="selectedOffice=${o.id};render()">${esc(o.name.replace(' Clerks','').replace('EVDCU Clerks – ','EVDCU '))}</button>`).join('')}</div>
 <div class="board-actions"><label>Round <select class="board-select" id="boardRound" onchange="state.round=Number(this.value);save();render()"><option value="1" ${state.round===1?'selected':''}>First round</option><option value="2" ${state.round===2?'selected':''}>Second round</option></select></label><span class="tag">${roster.length} employees</span><button class="btn primary" onclick="sendEmployeeBidLink()">Send employee bid link</button></div>
 <section id="peopleSection" class="board-section"><h3>Employees · ${esc(office.name)}</h3><p class="board-help">Drag a name onto a week below, or tap a week and choose the employee.</p><div class="roster-grid">${roster.map((e,i)=>{let a=state.selections.filter(s=>s.employeeId===e.id&&s.year===state.year);let one=a.filter(s=>s.round===1).flatMap(s=>s.weeks).sort((a,b)=>a-b);let two=a.filter(s=>s.round===2).flatMap(s=>s.weeks).sort((a,b)=>a-b);const selectedCount=a.reduce((sum,x)=>sum+x.weeks.length,0);return `<div class="roster-card"><div class="roster-line"><span class="roster-rank" aria-label="Seniority rank ${i+1}">${i+1}</span><div class="roster-name" draggable="true" ondragstart="dragEmployee(event,'${e.id}')">${esc(e.last)}${e.first?', '+esc(e.first):''}</div><strong class="roster-entitlement">${selectedCount} of ${e.entitlement}</strong></div></div>`}).join('')||'<div class="empty">No employees on this board.</div>'}</div></section>
 <section id="calendarSection" class="board-section"><h3>Weeks · ${state.year}</h3><div class="board-paper"><table class="board-table"><thead><tr><th class="weekcol">AL WEEK</th><th>Selected employee(s)</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
let draggedEmployeeId=null;
function dragEmployee(ev,id){draggedEmployeeId=id;ev.dataTransfer.setData('text/plain',id)}
function dropEmployee(ev,n){ev.preventDefault();ev.currentTarget.classList.remove('over');let id=ev.dataTransfer.getData('text/plain')||draggedEmployeeId;if(id)saveAssignment(id,n)}
function assignWeek(n){
 const office=state.offices.find(o=>o.id===selectedOffice),w=weeks().find(x=>x.n===n);
 if(blocked(office,w)){alert('That week is blocked for this board.');return}
 const list=empOrder(state.employees.filter(e=>e.officeId===office.id&&e.active!==false));
 const current=state.selections.find(x=>x.officeId===office.id&&x.year===state.year&&x.weeks.includes(n));
 const currentEmployee=current&&state.employees.find(e=>e.id===current.employeeId);
 const options='<option value="__open" '+(!currentEmployee?'selected':'')+'>Open</option>'+list.map(e=>`<option value="${esc(e.id)}" ${currentEmployee?.id===e.id?'selected':''}>${esc(e.last)}${e.first?', '+esc(e.first):''}</option>`).join('');
 document.getElementById("modalRoot").innerHTML=`<div class="modal-back" id="assignBackdrop"><div class="modal assignment-modal"><h3>Assign week ${n} · ${fmt(w.start)}–${fmt(w.end)}</h3><div class="field"><label>Choose employee</label><select id="assignEmployee">${options}</select></div><p class="muted tiny">Choose an employee, or select Open to clear this week's assignment.</p><div class="modal-foot assignment-foot"><button type="button" class="btn" onclick="cancelWeekAssignment()">Cancel</button><span class="modal-foot-spacer"></span><button type="button" class="btn primary" onclick="confirmWeekAssignment(${n})">Save</button></div></div></div>`;
}
function cancelWeekAssignment(){/* Cancel is deliberately non-mutating: discard the uncommitted dropdown choice. */document.getElementById("modalRoot").innerHTML="";}
function confirmWeekAssignment(n){const id=document.getElementById("assignEmployee")?.value;if(!id)return;if(id==="__open"){deleteWeekAssignment(n);closeModal();return}if(saveAssignment(id,n))closeModal()}
function deleteWeekAssignment(n){
 const office=state.offices.find(o=>o.id===selectedOffice);
 const matches=state.selections.filter(x=>x.officeId===office.id&&x.year===state.year&&x.weeks.includes(n));
 if(!matches.length){closeModal();return}
 matches.forEach(s=>{s.weeks=s.weeks.filter(w=>w!==n);if(!s.weeks.length)state.selections=state.selections.filter(x=>x!==s)});
 save();render();
}
function saveAssignment(id,n){let e=state.employees.find(x=>x.id===id),office=state.offices.find(o=>o.id===selectedOffice),w=weeks().find(x=>x.n===n);if(!e||!office||blocked(office,w))return false;let conflicting=state.selections.some(s=>s.officeId===office.id&&s.year===state.year&&s.weeks.includes(n)&&s.employeeId!==id);if(conflicting){alert('That week is already assigned to another employee on this board.');return false}let existing=state.selections.find(s=>s.employeeId===id&&s.officeId===office.id&&s.year===state.year&&s.round===state.round);if(!existing){existing={id:crypto.randomUUID(),employeeId:id,officeId:office.id,year:state.year,round:state.round,weeks:[],method:'Manual board entry',submittedAt:new Date().toISOString()};state.selections.push(existing)}if(!existing.weeks.includes(n))existing.weeks.push(n);existing.weeks.sort((a,b)=>a-b);let firstWeeks=state.selections.filter(s=>s.employeeId===id&&s.year===state.year&&s.round===1).flatMap(s=>s.weeks).sort((a,b)=>a-b);let secondWeeks=state.selections.filter(s=>s.employeeId===id&&s.year===state.year&&s.round===2).flatMap(s=>s.weeks);let invalid=state.round===1?(firstWeeks.length>Math.min(3,e.entitlement)||!validBlocks(firstWeeks)):(firstWeeks.length+secondWeeks.length>e.entitlement);if(invalid){existing.weeks=existing.weeks.filter(x=>x!==n);if(!existing.weeks.length)state.selections=state.selections.filter(s=>s!==existing);alert(state.round===1?'First round is limited to three weeks in no more than two blocks.':'This would exceed the employee’s remaining entitlement.');return false}save();render();return true}
function removeWeek(id,n,round){let s=state.selections.find(x=>x.employeeId===id&&x.officeId===selectedOffice&&x.year===state.year&&x.round===round);if(!s)return;s.weeks=s.weeks.filter(x=>x!==n);if(!s.weeks.length)state.selections=state.selections.filter(x=>x!==s);save();render()}

function dashboard(m){let total=state.employees.length,done=state.selections.filter(s=>s.year===state.year&&s.round===1).length; m.innerHTML=head("Administrator dashboard","Manage the seven annual leave lists from your computer or phone.",`<button class="btn primary" onclick="setPage('bidding')">Open bidding control</button>`)+`
<div class="cards"><div class="card stat"><div class="label">Bidding lists</div><strong>7</strong></div><div class="card stat"><div class="label">Employees entered</div><strong>${total}</strong></div><div class="card stat"><div class="label">First-round submissions</div><strong>${done}</strong></div><div class="card stat"><div class="label">Leave year</div><strong>${state.year}</strong></div></div>
<div class="grid2"><section class="panel"><div class="panel-head"><h3>Office bidding lists</h3><button class="btn small" onclick="setPage('boards')">View all</button></div><div class="office-grid">${state.offices.map(o=>`<div class="office"><div><strong>${esc(o.name)}</strong><small>${state.employees.filter(e=>e.officeId===o.id&&e.active!==false).length} employees</small></div><span class="tag ${christmasBlocked(o)?"blocked":"open"}">${christmasBlocked(o)?"Christmas blocked":"Christmas open"}</span></div>`).join("")}</div></section>
<section class="panel"><div class="panel-head"><h3>Important annual settings</h3><button class="btn small" onclick="setPage('settings')">Edit settings</button></div><p><b>Union convention:</b><br>${fmt(new Date(state.unionStart+"T12:00:00"))} – ${fmt(new Date(state.unionEnd+"T12:00:00"))}, ${state.year}</p><p><b>New AL availability:</b><br>${new Date(state.leaveAvailable+"T12:00:00").toLocaleDateString()}</p><p><b>Christmas rotation:</b><br>Groups A and B alternate; Custodians/Maintenance always open.</p><div class="notice">Early January selections may require prior-year leave. No individual leave balances are stored or displayed on this board.</div></section></div>
<section class="panel"><div class="panel-head"><h3>Recent activity</h3><span class="tag warn">Local prototype</span></div>${state.selections.length?`<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Office</th><th>Round</th><th>Weeks</th><th>Entry method</th></tr></thead><tbody>${state.selections.slice(-8).reverse().map(selectionRow).join("")}</tbody></table></div>`:`<div class="empty">No bids entered yet. Add employees, then use Bidding Control to record a test submission.</div>`}</section>`}
function selectionRow(s){let e=state.employees.find(x=>x.id===s.employeeId);let o=state.offices.find(x=>x.id===s.officeId);return `<tr><td>${esc(e?e.first+" "+e.last:"Unknown employee")}</td><td>${esc(o?.name||"")}</td><td>${s.round}</td><td>${s.weeks.join(", ")}</td><td>${esc(s.method)}</td></tr>`}
function boards(m){
 // The "Seven bidding lists" navigation opens the actual leave board, not the employee directory.
 // Board tabs inside boardPage() switch between the seven offices.
 boardPage(m);
}
function employees(m){
 let list=empOrder(state.employees.filter(e=>e.active!==false));
 m.innerHTML=head("Employee directory","All active employees across all seven bidding lists, sorted by seniority.",`<button class="btn" onclick="setPage('settingsHub')">← Exit settings</button><button class="btn primary" onclick="employeeModal()">＋ Add employee</button>`)+`

function printYear(openPrint=true){

 const lastWeekday=(y,m,day)=>{const d=new Date(y,m+1,0,12);d.setDate(d.getDate()-((d.getDay()-day+7)%7));return d};

 const pickMeta=(employee,round)=>{

  render();
  if(realtimeChannel)await supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel=supabaseClient.channel("annual-leave-shared-state")
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"annual_leave_app_state",filter:"id=eq.main"},payload=>{
    if(!cloudReady||!payload.new?.payload)return;
    state=payload.new.payload;
    safeLocalBackup();
    setSyncStatus("Updated");
    render();
   }).subscribe();
 }
 const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
 if(sessionError)console.warn(sessionError);
 if(session){try{await enterApp(session)}catch(err){console.error(err);document.getElementById("loginError").textContent="Could not load shared data: "+(err.message||"Please try again.");}}
 loginForm.addEventListener("submit",async ev=>{
  ev.preventDefault();loginButton.disabled=true;loginButton.textContent="Signing in…";
  const username=document.getElementById("loginUsername").value.trim().toLowerCase();
  const password=document.getElementById("loginPassword").value;
  const internalEmail=username+"@annualleave.invalid";
  try{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email:internalEmail,password});
   if(error)throw error;
   await enterApp(data.session);
  }catch(err){console.error(err);document.getElementById("loginError").textContent="Sign-in failed. Check your username and password."; }
  finally{loginButton.disabled=false;loginButton.textContent="Sign in";}
 });
}
// Export button was removed from the interface; no handler is needed.
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{let id=b.dataset.jump;if(id==="top"){window.scrollTo({top:0,behavior:"smooth"});}else{document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"});}document.querySelectorAll("[data-jump]").forEach(x=>x.classList.toggle("active",x===b));}));
startSharedApp();
</script>
