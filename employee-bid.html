<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Annual Leave Bid</title>
<style>
:root{--ink:#202020;--muted:#59636b;--line:#777;--paper:#fff;--bg:#e7edf2;--navy:#17324d;--postal:#d8e5ef;--teal:#167c80;--red:#a33d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 Arial,Helvetica,sans-serif}.wrap{max-width:850px;margin:14px auto;padding:0 10px}.paper{background:#fff;border:3px solid #9aafc0;padding:14px;box-shadow:0 3px 14px #18334a12}.head{text-align:center;background:var(--postal);border:1px solid #a9bdce;border-bottom:3px solid #55758f;padding:12px 8px 10px;margin:-2px -2px 10px;border-radius:2px}.head .master{font-family:Georgia,serif;font-size:19px;font-weight:bold;text-decoration:underline;text-decoration-color:#ddd;text-decoration-thickness:5px;text-underline-offset:-3px;margin-bottom:4px}.head h1{font-size:16px;font-weight:600;margin:5px 0}.head p{margin:3px;color:var(--muted);font-size:12px}.person{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 10px;margin-bottom:10px}.person strong{font-size:15px}.person small{font-size:11px;color:#4e5961}.note{display:none}.note.error{display:block;background:#faeaea;border:1px solid var(--red);color:#873737;padding:8px 10px;margin:9px 0;font-size:12px}.tablewrap{overflow:visible}table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0}th,td{border:1px solid #777;padding:7px 6px;font-size:13px;line-height:1.2;vertical-align:middle}th{background:#f7f7f7;font-weight:600;text-align:center}.date{width:19%;text-align:center;white-space:normal}.weekname{text-align:center;width:62%}.pick{background:#fff;height:54px;min-height:54px;padding:3px 5px;vertical-align:middle}.pick button{border:0;background:transparent;width:100%;height:48px;min-height:48px;padding:3px 4px;color:var(--teal);font-weight:700;font-size:13px;text-align:center;white-space:normal;overflow-wrap:anywhere}.pick.selected{background:#e5f2ef;outline:2px solid var(--teal);outline-offset:-2px}.pick.taken{background:#dfe3e6;color:#555}.pick.taken button{display:none}.pick.blocked{background:#dfe3e6;color:#67717a}.pick button:disabled{cursor:not-allowed;color:#555}.pick.selected button{color:#145e60}.current-names{display:flex;width:100%;height:48px;min-height:48px;font-size:14px;line-height:1.2;font-weight:700;color:#444;overflow-wrap:anywhere;text-align:center;padding:4px;align-items:center;justify-content:center}.holiday{display:block;width:100%;font-size:10px;line-height:12px;font-weight:600;color:#4d5962;text-align:center;margin:0 auto 2px}.pick.blocked button:disabled{color:#67717a}.footer{margin-top:10px;font-size:11px;text-align:center;color:#4e5961}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}.count{font-weight:700;font-size:13px}.btn{border:0;border-radius:5px;background:var(--navy);color:#fff;padding:12px 18px;font-weight:700;font-size:15px}.btn:disabled{opacity:.5}.loading{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:650px){.wrap{margin:6px auto;padding:0 5px}.paper{padding:8px}.head{padding-bottom:8px;margin-bottom:8px}.head .master{font-size:17px}.head h1{font-size:14px}.person{padding:7px}.person strong{font-size:14px}th,td{font-size:11px;padding:7px 3px}.date{font-size:11px}.weekname{font-size:11px}.pick button{font-size:12px;height:48px;min-height:48px;padding:3px 2px}.current-names{font-size:14px;height:48px;min-height:48px;padding:3px}.holiday{font-size:9px;line-height:11px}.actions{display:block}.count{display:block;margin:0 0 8px}.btn{width:100%}}

/* Branded prior-year leave confirmation */
.confirm-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(20,36,50,.58);display:flex;align-items:center;justify-content:center;padding:22px}.confirm-card{width:min(100%,430px);background:#fff;border:2px solid #9aafc0;border-radius:10px;box-shadow:0 16px 48px #10283d55;overflow:hidden}.confirm-title{background:var(--postal);border-bottom:3px solid #55758f;color:var(--navy);padding:15px 18px;font-family:Georgia,serif;font-weight:bold;font-size:18px}.confirm-message{padding:22px 20px 12px;color:#303b44;font-size:17px;line-height:1.45}.confirm-actions{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px 18px}.confirm-actions button{min-width:104px;border-radius:6px;padding:11px 16px;font-size:15px;font-weight:700;border:1px solid #8fa6b8}.confirm-cancel{background:#fff;color:var(--navy)}.confirm-ok{background:var(--navy);color:#fff;border-color:var(--navy)}.confirm-actions button:focus-visible{outline:3px solid #70b8d0;outline-offset:2px}
</style></head><body><main class="wrap"><section class="paper" id="app"><div class="loading">Loading your annual leave board…</div></section></main>
<script>
const API="https://ghnuahsovbpyzrjvbylp.supabase.co/functions/v1/employee-bidding";
const token=new URLSearchParams(location.search).get("token");let data=null,selected=new Set(),busy=false;
const el=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateAdd=(d,n)=>{let x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x};
const fmt=d=>new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(d);const dayShort=d=>["Sun","Mon","Tues","Weds","Thurs","Fri","Sat"][d.getDay()];
function weeks(year){let a=[],d=new Date(year,0,1,12);while(d.getDay()!==1)d.setDate(d.getDate()+1);let n=1;while(d.getFullYear()<=year){let end=dateAdd(d.toISOString().slice(0,10),6);a.push({n:n++,start:new Date(d),end});d.setDate(d.getDate()+7)}return a}
function isBlocked(w){const o=data.office,cx=data.config;const union=w.start<=new Date(cx.unionEnd+"T23:59:59")&&w.end>=new Date(cx.unionStart+"T00:00:00");let christmas=o.group!=="always"&&(cx.year%2===1?o.group==="A":o.group==="B")&&w.start<=new Date(cx.year+1,0,3,12)&&w.end>=new Date(cx.year,11,20,12);return union||christmas}
function existingWeek(w){return data.selections.some(s=>s.weeks.includes(w.n))}
function chosenMax(){return data.invite.round===1?Math.min(3,data.employee.entitlement):Math.max(0,data.employee.entitlement-data.roundOneWeeks)}
function countBlocks(a){if(!a.length)return 0;let b=1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)b++;return b}
function holidayForWeek(w){const y=data.config.year;const nth=(m,day,n)=>{const d=new Date(y,m,1,12);d.setDate(1+((day-d.getDay()+7)%7)+(n-1)*7);return d};const last=(m,day)=>{const d=new Date(y,m+1,0,12);d.setDate(d.getDate()-((d.getDay()-day+7)%7));return d};const observed=(m,day)=>{const d=new Date(y,m,day,12);if(d.getDay()===6)d.setDate(d.getDate()-1);else if(d.getDay()===0)d.setDate(d.getDate()+1);return d};const holidays=[["New Year's Day",observed(0,1)],["MLK",nth(0,1,3)],["Presidents Day",nth(1,1,3)],["Memorial Day",last(4,1)],["Juneteenth",observed(5,19)],["Independence Day",observed(6,4)],["Labor Day",nth(8,1,1)],["Columbus Day",nth(9,1,2)],["Veterans Day",observed(10,11)],["Thanksgiving",nth(10,4,4)],["Christmas",observed(11,25)]];return holidays.filter(([name,d])=>d>=w.start&&d<=w.end)}
function render(){const ws=weeks(data.config.year),max=chosenMax();const rows=ws.map((w,i)=>{const blocked=isBlocked(w),taken=existingWeek(w),on=selected.has(w.n);const other=data.selections.filter(s=>s.weeks.includes(w.n)).map(s=>s.employeeName).filter(Boolean);const holidays=holidayForWeek(w);const unavailable=blocked||taken;const label=blocked?"Blocked":on?"Selected":"";return `<tr><td class="date">${fmt(w.start)}</td><td class="date">${fmt(w.end)}</td><td class="pick ${blocked?"blocked":taken?"taken":on?"selected":""}" data-cell-week="${w.n}">${holidays.map(h=>`<span class="holiday">${esc(h[0])} · ${fmt(h[1])}</span>`).join("")}${taken&&!blocked?`<span class="current-names">${esc(other.join(", ")||"Already selected")}</span>`:""}<button type="button" aria-label="${blocked?"Blocked":taken?(other.join(", ")||"Already selected"):on?"Selected":"Select week beginning "+fmt(w.start)}" data-week="${w.n}" ${unavailable?"disabled":""}>${esc(label)}</button></td></tr>`}).join("");
el("app").innerHTML=`<header class="head"><div class="master">ANNUAL LEAVE BIDDING</div><h1>${esc(data.office.name)} · AL ${data.config.year}</h1><p>Employee bidding · Round ${data.invite.round}</p></header>
<div class="person"><div><strong>${esc(data.employee.first)} ${esc(data.employee.last)}</strong><br><small>Seniority: ${esc(data.employee.seniority)}</small></div><div style="text-align:right"><strong>${data.invite.round===1?data.employee.entitlement:Math.max(0,data.employee.entitlement-data.roundOneWeeks)} weeks</strong><br><small>${data.invite.round===1?"Annual entitlement":"Remaining"}</small></div></div>
<div class="tablewrap"><table><colgroup><col style="width:19%"><col style="width:19%"><col style="width:62%"></colgroup><thead><tr><th class="date">WEEK BEGIN</th><th class="date">WEEK END</th><th class="weekname">SELECT YOUR BID</th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="actions"><span class="count" id="count">${selected.size} of ${max} weeks selected</span><button class="btn" id="submit" ${selected.size===0?"disabled":""}>Submit my bid</button></div>
<div class="footer">First round: up to 3 weeks in no more than 2 blocks. Second round: remaining entitlement, subject to availability.</div>`;
document.querySelectorAll("[data-week]").forEach(b=>b.addEventListener("click",async()=>{const n=Number(b.dataset.week);if(selected.has(n)){selected.delete(n)}else{const w=weeks(data.config.year).find(x=>x.n===n);const cutoff=data.config.leaveAvailable;if(cutoff&&w&&w.start.getFullYear()===data.config.year&&w.start<new Date(cutoff+"T12:00:00")){const ok=await priorLeaveConfirm();if(!ok)return}selected.add(n)}updateSelection()}));el("submit").addEventListener("click",submit)}
function priorLeaveConfirm(){return new Promise(resolve=>{const overlay=document.createElement("div");overlay.className="confirm-backdrop";overlay.innerHTML=`<section class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="prior-leave-title"><div class="confirm-title" id="prior-leave-title">Annual Leave Reminder</div><div class="confirm-message">You must have leftover AL from the prior year to take this week.</div><div class="confirm-actions"><button type="button" class="confirm-cancel">Cancel</button><button type="button" class="confirm-ok">OK to continue</button></div></section>`;document.body.appendChild(overlay);const finish=value=>{overlay.remove();resolve(value)};overlay.querySelector(".confirm-cancel").addEventListener("click",()=>finish(false));overlay.querySelector(".confirm-ok").addEventListener("click",()=>finish(true));overlay.addEventListener("click",e=>{if(e.target===overlay)finish(false)});overlay.querySelector(".confirm-ok").focus()})}
function updateSelection(){const a=[...selected].sort((x,y)=>x-y),max=chosenMax();let msg="";if(a.length>max)msg="You may select no more than "+max+" weeks.";else if(data.invite.round===1&&countBlocks(a)>2)msg="First-round choices may be split into no more than two blocks.";else if(a.some(n=>isBlocked(weeks(data.config.year).find(w=>w.n===n))||existingWeek({n})))msg="One or more selected weeks are no longer available.";if(msg){let n=el("notice");if(!n){n=document.createElement("div");n.className="note error";n.id="notice";el("app").insertBefore(n,el("app").querySelector(".tablewrap"))}n.textContent=msg}else el("notice")?.remove();const c=el("count");if(c)c.textContent=a.length+" of "+max+" weeks selected";const b=el("submit");if(b)b.disabled=busy||!a.length||!!msg;document.querySelectorAll("[data-week]").forEach(x=>{const n=Number(x.dataset.week),blocked=isBlocked(weeks(data.config.year).find(w=>w.n===n)),taken=existingWeek({n}),on=selected.has(n),cell=x.closest("td");cell.classList.toggle("selected",on);cell.classList.toggle("blocked",blocked);cell.classList.toggle("taken",!blocked&&taken);x.textContent=blocked?"Blocked":on?"Selected":"";x.disabled=blocked||taken})}

async function call(action,body={}){let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_1Z7ddDl3qiL-8LRLhtML8Q_EOyJs6E2"},body:JSON.stringify({action,token,...body})})}catch(e){throw new Error("Could not reach the bidding service: "+(e.message||e))}const raw=await r.text();let j;try{j=raw?JSON.parse(raw):{}}catch{j={error:raw||"The service returned an unreadable response."}}if(!r.ok||j.error||j.message)throw new Error((j.error||j.message||j.msg||"Request failed")+(j.code?" [code "+j.code+"]":"")+(r.status?" (HTTP "+r.status+")":""));return j}
async function submit(){if(busy)return;updateSelection();if(el("submit").disabled)return;busy=true;el("submit").disabled=true;el("submit").textContent="Submitting…";try{const result=await call("submit",{weeks:[...selected].sort((a,b)=>a-b)});el("app").innerHTML=`<div class="loading"><h2>Bid submitted!</h2><p>Your selections have been added to the shared annual leave board.</p><p>You can close this page now.</p></div>`}catch(e){busy=false;el("submit").textContent="Submit my bid";document.querySelectorAll("#notice").forEach((n,i)=>{if(i)n.remove()});let n=el("notice");if(!n){n=document.createElement("div");n.className="note error";n.id="notice";el("app").insertBefore(n,el("app").querySelector(".tablewrap"))}n.textContent=e.message;const c=el("count");if(c)c.textContent=[...selected].length+" of "+chosenMax()+" weeks selected";el("submit").disabled=false}}
(async()=>{if(!token){el("app").innerHTML='<div class="loading">This bidding link is incomplete. Please contact your supervisor.</div>';return}try{data=await call("get");render()}catch(e){el("app").innerHTML='<div class="loading"><h2>Link unavailable</h2><p>'+esc(e.message)+'</p>Please contact your supervisor.</div>'}})();
</script></body></html>
