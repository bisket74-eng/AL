<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Annual Leave Bid</title>
<style>
:root{--ink:#202020;--muted:#59636b;--line:#777;--paper:#fff;--bg:#eef1f3;--navy:#17324d;--teal:#167c80;--red:#a33d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 Arial,Helvetica,sans-serif}.wrap{max-width:850px;margin:14px auto;padding:0 10px}.paper{background:#fff;border:1px solid #9da8af;padding:14px;box-shadow:0 3px 14px #18334a12}.head{text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:10px}.head .master{font-family:Georgia,serif;font-size:19px;font-weight:bold;text-decoration:underline;text-decoration-color:#ddd;text-decoration-thickness:5px;text-underline-offset:-3px;margin-bottom:4px}.head h1{font-size:16px;font-weight:600;margin:5px 0}.head p{margin:3px;color:var(--muted);font-size:12px}.person{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 10px;margin-bottom:10px}.person strong{font-size:15px}.person small{font-size:11px;color:#4e5961}.note{background:#f3f5f6;border:1px solid #c8cdd1;padding:8px 10px;margin:9px 0;font-size:12px}.note.error{background:#faeaea;border-color:var(--red);color:#873737}.note.good{background:#e7f4f3;color:#145e60}.tablewrap{overflow:visible}table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0}th,td{border:1px solid #777;padding:7px 8px;font-size:13px;line-height:1.2;vertical-align:middle}th{background:#f7f7f7;font-weight:600;text-align:center}.date{width:17%;text-align:center;white-space:nowrap}.weekname{text-align:left;width:66%}.current{font-size:12px;text-align:left;overflow-wrap:anywhere}.pick{background:#fff;cursor:pointer;min-height:39px}.pick button{border:0;background:transparent;width:100%;min-height:38px;padding:5px 2px;color:var(--teal);font-weight:700;font-size:13px;text-align:left}.pick.selected{background:#e5f2ef;outline:2px solid var(--teal);outline-offset:-2px}.pick.taken{background:#f5f5f5;color:#555}.pick.blocked{background:#e3e5e7;color:#67717a}.pick:disabled{cursor:not-allowed}.pick.selected button{color:#145e60}.pick.taken button{color:#555}.pick.blocked button{color:#67717a}.footer{margin-top:10px;font-size:11px;text-align:center;color:#4e5961}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}.count{font-weight:700;font-size:13px}.btn{border:0;border-radius:5px;background:var(--navy);color:#fff;padding:12px 18px;font-weight:700;font-size:15px}.btn:disabled{opacity:.5}.loading{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:650px){.wrap{margin:6px auto;padding:0 5px}.paper{padding:8px}.head{padding-bottom:8px;margin-bottom:8px}.head .master{font-size:17px}.head h1{font-size:14px}.person{padding:7px}.person strong{font-size:14px}.note{font-size:11px;padding:7px}.date{width:19%;font-size:11px;padding:7px 2px}.weekname{width:62%}th,td{font-size:11px;padding:7px 4px}.current{font-size:11px}.pick button{font-size:12px;min-height:38px}.actions{display:block}.count{display:block;margin:0 0 8px}.btn{width:100%}}
</style></head><body><main class="wrap"><section class="paper" id="app"><div class="loading">Loading your annual leave board…</div></section></main>
<script>
const API="https://ghnuahsovbpyzrjvbylp.supabase.co/functions/v1/employee-bidding";
const token=new URLSearchParams(location.search).get("token");let data=null,selected=new Set(),busy=false;
const el=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateAdd=(d,n)=>{let x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x};
const fmt=d=>new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(d);
function weeks(year){let a=[],d=new Date(year,0,1,12);while(d.getDay()!==1)d.setDate(d.getDate()+1);let n=1;while(d.getFullYear()<=year){let end=dateAdd(d.toISOString().slice(0,10),6);a.push({n:n++,start:new Date(d),end});d.setDate(d.getDate()+7)}return a}
function isBlocked(w){const o=data.office,cx=data.config;const union=w.start<=new Date(cx.unionEnd+"T23:59:59")&&w.end>=new Date(cx.unionStart+"T00:00:00");let christmas=o.group!=="always"&&(cx.year%2===1?o.group==="A":o.group==="B")&&w.start<=new Date(cx.year+1,0,3,12)&&w.end>=new Date(cx.year,11,20,12);return union||christmas}
function existingWeek(w){return data.selections.some(s=>s.weeks.includes(w.n)&&s.employeeId!==data.employee.id)}
function chosenMax(){return data.invite.round===1?Math.min(3,data.employee.entitlement):Math.max(0,data.employee.entitlement-data.roundOneWeeks)}
function countBlocks(a){if(!a.length)return 0;let b=1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)b++;return b}
function render(){const ws=weeks(data.config.year),max=chosenMax();const rows=ws.map(w=>{const taken=existingWeek(w),blocked=isBlocked(w),on=selected.has(w.n);const other=data.selections.filter(s=>s.weeks.includes(w.n)).map(s=>s.employeeName).filter(Boolean);let label=blocked?"Blackout":taken?(other.join(", ")||"Already selected"):on?"Your choice":"Open · tap to choose";return `<tr><td class="date">${fmt(w.start)}</td><td class="date">${fmt(w.end)}</td><td class="pick ${blocked?"blocked":taken?"taken":on?"selected":""}"><button type="button" data-week="${w.n}" ${blocked||taken?"disabled":""}>${esc(label)}</button></td></tr>`}).join("");
el("app").innerHTML=`<header class="head"><div class="master">ANNUAL LEAVE BIDDING</div><h1>${esc(data.office.name)} · AL ${data.config.year}</h1><p>Employee bidding · Round ${data.invite.round}</p></header>
<div class="person"><div><strong>${esc(data.employee.first)} ${esc(data.employee.last)}</strong><br><small>Seniority: ${esc(data.employee.seniority)}</small></div><div style="text-align:right"><strong>${data.employee.entitlement} weeks</strong><br><small>Annual entitlement</small></div></div>
<div class="note">Tap an open week to select it. Current sign-ups are shown on the bid sheet. Your selections are checked against the board before submission.</div>
<div class="tablewrap"><table><thead><tr><th class="date">${data.config.year}<br>AL BEGIN</th><th class="date">WEEK END</th><th class="weekname">Current sign-ups · Your choice</th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="actions"><span class="count" id="count">${selected.size} of ${max} weeks selected</span><button class="btn" id="submit" ${selected.size===0?"disabled":""}>Submit my bid</button></div>
<div class="footer">First round: up to 3 weeks in no more than 2 blocks. Second round: remaining entitlement, subject to availability. Blackout weeks and weeks already selected cannot be chosen.</div>`;
document.querySelectorAll("[data-week]").forEach(b=>b.addEventListener("click",()=>{const n=Number(b.dataset.week);if(selected.has(n))selected.delete(n);else selected.add(n);updateSelection()}));el("submit").addEventListener("click",submit)}

function updateSelection(){const a=[...selected].sort((x,y)=>x-y),max=chosenMax();let msg="";if(a.length>max)msg="You may select no more than "+max+" weeks.";else if(data.invite.round===1&&countBlocks(a)>2)msg="First-round choices may be split into no more than two blocks.";else if(a.some(n=>isBlocked(weeks(data.config.year).find(w=>w.n===n))||existingWeek({n})))msg="One or more selected weeks are no longer available.";if(msg){el("notice")?.remove();const n=document.createElement("div");n.className="note error";n.id="notice";n.textContent=msg;el("app").insertBefore(n,el("app").querySelector(".tablewrap"))}else el("notice")?.remove();const c=el("count");if(c)c.textContent=a.length+" of "+max+" weeks selected";const b=el("submit");if(b)b.disabled=busy||!a.length||!!msg;document.querySelectorAll("[data-week]").forEach(x=>{const n=Number(x.dataset.week);x.closest("td").classList.toggle("selected",selected.has(n));x.textContent=selected.has(n)?"Selected":"Open"})}
async function call(action,body={}){let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_1Z7ddDl3qiL-8LRLhtML8Q_EOyJs6E2"},body:JSON.stringify({action,token,...body})})}catch(e){throw new Error("Could not reach the bidding service: "+(e.message||e))}const raw=await r.text();let j;try{j=raw?JSON.parse(raw):{}}catch{j={error:raw||"The service returned an unreadable response."}}if(!r.ok||j.error||j.message)throw new Error((j.error||j.message||j.msg||"Request failed")+(j.code?" [code "+j.code+"]":"")+(r.status?" (HTTP "+r.status+")":""));return j}
async function submit(){if(busy)return;updateSelection();if(el("submit").disabled)return;busy=true;el("submit").disabled=true;el("submit").textContent="Submitting…";try{const result=await call("submit",{weeks:[...selected].sort((a,b)=>a-b)});el("app").innerHTML=`<div class="loading"><h2>Bid submitted!</h2><p>Your selections have been added to the shared annual leave board.</p><p>You can close this page now.</p></div>`}catch(e){busy=false;el("submit").textContent="Submit my bid";const n=document.createElement("div");n.className="note error";n.textContent=e.message;el("app").insertBefore(n,el("app").querySelector(".tablewrap"));updateSelection()}}
(async()=>{if(!token){el("app").innerHTML='<div class="loading">This bidding link is incomplete. Please contact your supervisor.</div>';return}try{data=await call("get");render()}catch(e){el("app").innerHTML='<div class="loading"><h2>Link unavailable</h2><p>'+esc(e.message)+'</p>Please contact your supervisor.</div>'}})();
</script></body></html>
