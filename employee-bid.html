<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Annual Leave Bid</title>
<style>
:root{--navy:#17324d;--ink:#1c2935;--muted:#687887;--line:#cbd4da;--teal:#167c80;--red:#a33d3d;--paper:#fff;--bg:#eef2f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Arial,sans-serif}.wrap{max-width:980px;margin:20px auto;padding:0 14px}.paper{background:var(--paper);border:1px solid #9da8af;padding:18px;box-shadow:0 5px 22px #18334a12}.head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}.head .master{font:700 18px Georgia,serif;text-decoration:underline;text-decoration-color:#dce76b;text-decoration-thickness:6px;text-underline-offset:-3px}.head h1{font-size:19px;margin:5px 0}.head p{margin:3px;color:var(--muted);font-size:13px}.person{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);padding:10px;margin-bottom:12px}.person strong{font-size:16px}.note{background:#edf3f7;border-left:4px solid var(--teal);padding:10px 12px;margin:12px 0;font-size:13px}.note.error{background:#faeaea;border-color:var(--red);color:#873737}.note.good{background:#e7f4f3;color:#145e60}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px;table-layout:fixed}th,td{border:1px solid #68737b;padding:5px 6px;font-size:12px;text-align:center}th{background:#f4f5f5;font-weight:700}.date{width:78px;white-space:nowrap}.weekname{width:24%;text-align:left}.blackband{width:12px;background:#4f5961;padding:0}.own{background:#edf3f7;font-weight:700;text-align:left}.pick{background:#fff;cursor:pointer;min-height:30px}.pick button{border:0;background:transparent;width:100%;min-height:30px;color:var(--teal);font-weight:700}.pick.selected{background:#dff1ee;outline:2px solid var(--teal);outline-offset:-2px}.pick.taken{background:#fceeee;color:#a33d3d}.pick.blocked{background:#e3e5e7;color:#67717a}.pick:disabled{cursor:not-allowed}.current{font-size:11px;overflow-wrap:anywhere}.footer{margin-top:12px;font-size:12px;text-align:center}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.count{font-weight:700}.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:12px 18px;font-weight:700;font-size:15px}.btn:disabled{opacity:.5}.loading{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:650px){.wrap{margin:8px auto;padding:0 7px}.paper{padding:9px}.head h1{font-size:16px}.head .master{font-size:15px}.person{padding:8px}.date{width:66px}.weekname{width:22%}th,td{font-size:10px;padding:4px 3px}.current{font-size:9px}.btn{width:100%}}
</style></head><body><main class="wrap"><section class="paper" id="app"><div class="loading">Loading your annual leave board…</div></section></main>
<script>
const API="https://ghnuahsovbpyzrjvbylp.supabase.co/functions/v1/employee-bidding";
const token=new URLSearchParams(location.search).get("token");let data=null,selected=new Set(),busy=false;
const el=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateAdd=(d,n)=>{let x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x};
const fmt=d=>new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(d);
function weeks(year){let a=[],d=new Date(year,0,1,12);while(d.getDay()!==1)d.setDate(d.getDate()+1);let n=1;while(d.getFullYear()<=year){let end=dateAdd(d.toISOString().slice(0,10),6);a.push({n:n++,start:new Date(d),end});d.setDate(d.getDate()+7)}return a}
function isBlocked(w){const o=data.office,cx=data.config;const union=w.start<=new Date(cx.unionEnd+"T23:59:59")&&w.end>=new Date(cx.unionStart+"T00:00:00");let christmas=o.group!=="always"&&(cx.year%2===1?o.group==="A":o.group==="B")&&w.start<=new Date(cx.year+1,0,3,12)&&w.end>=new Date(cx.year,11,20,12);return union||christmas}
function existingWeek(w){return data.selections.some(s=>s.weeks.includes(w.n)&&s.employeeId!==data.employee.id)}
function chosenMax(){return data.invite.round===1?Math.min(3,data.employee.entitlement):Math.max(0,data.employee.entitlement-data.roundOneWeeks)}
function countBlocks(a){if(!a.length)return 0;let b=1;for(let i=1;i<a.length;i++)if(a[i]!==a[i-1]+1)b++;return b}
function render(){const ws=weeks(data.config.year),max=chosenMax();const rows=ws.map(w=>{const taken=existingWeek(w),blocked=isBlocked(w),on=selected.has(w.n);const other=data.selections.filter(s=>s.weeks.includes(w.n)).map(s=>s.employeeName).filter(Boolean);const state=blocked?"Blocked":taken?"Already selected":on?"Selected":"Open";return `<tr><td class="date">${fmt(w.start)}</td><td class="date">${fmt(w.end)}</td><td class="weekname current">${other.map(esc).join("<br>")||"—"}</td><td class="blackband"></td><td class="own">${esc(data.employee.last)}, ${esc(data.employee.first)}</td><td class="current">${data.invite.round===1? "—":data.roundOneWeeks+" wk"}</td><td class="current">${data.invite.round===2? "Round 2": "Round 1"}</td><td class="pick ${blocked?"blocked":taken?"taken":on?"selected":""}"><button type="button" data-week="${w.n}" ${blocked||taken?"disabled":""}>${state}</button></td></tr>`}).join("");
el("app").innerHTML=`<header class="head"><div class="master">ANNUAL LEAVE BIDDING</div><h1>${esc(data.office.name)} · AL ${data.config.year}</h1><p>Employee self-bidding · Round ${data.invite.round}</p></header>
<div class="person"><div><strong>${esc(data.employee.first)} ${esc(data.employee.last)}</strong><br><small>Seniority: ${esc(data.employee.seniority)}</small></div><div><strong>${data.employee.entitlement} weeks</strong><br><small>Annual entitlement</small></div></div>
<div class="note">Tap the Open cell for each week you want. Your choices are checked against the board immediately. Your bid is submitted directly to the shared master board.</div>
<div class="tablewrap"><table><thead><tr><th colspan="2">${data.config.year} · Week dates</th><th>Current sign-ups</th><th class="blackband"></th><th>Employee</th><th>Round 1</th><th>Bid round</th><th>Your choice</th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="actions"><span class="count" id="count">${selected.size} of ${max} weeks selected</span><button class="btn" id="submit" ${selected.size===0?"disabled":""}>Submit my bid</button></div>
<div class="footer">First round: up to 3 weeks in no more than 2 blocks. Second round: remaining entitlement, subject to availability. Blackout weeks and weeks already selected cannot be chosen.</div>`;
document.querySelectorAll("[data-week]").forEach(b=>b.addEventListener("click",()=>{const n=Number(b.dataset.week);if(selected.has(n))selected.delete(n);else selected.add(n);updateSelection()}));el("submit").addEventListener("click",submit)}
function updateSelection(){const a=[...selected].sort((x,y)=>x-y),max=chosenMax();let msg="";if(a.length>max)msg="You may select no more than "+max+" weeks.";else if(data.invite.round===1&&countBlocks(a)>2)msg="First-round choices may be split into no more than two blocks.";else if(a.some(n=>isBlocked(weeks(data.config.year).find(w=>w.n===n))||existingWeek({n})))msg="One or more selected weeks are no longer available.";if(msg){el("notice")?.remove();const n=document.createElement("div");n.className="note error";n.id="notice";n.textContent=msg;el("app").insertBefore(n,el("app").querySelector(".tablewrap"))}else el("notice")?.remove();const c=el("count");if(c)c.textContent=a.length+" of "+max+" weeks selected";const b=el("submit");if(b)b.disabled=busy||!a.length||!!msg;document.querySelectorAll("[data-week]").forEach(x=>{const n=Number(x.dataset.week);x.closest("td").classList.toggle("selected",selected.has(n));x.textContent=selected.has(n)?"Selected":"Open"})}
async function call(action,body={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_1Z7ddDl3qiL-8LRLhtML8Q8_EOyJs6E2"},body:JSON.stringify({action,token,...body})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||"Request failed");return j}
async function submit(){if(busy)return;updateSelection();if(el("submit").disabled)return;busy=true;el("submit").disabled=true;el("submit").textContent="Submitting…";try{const result=await call("submit",{weeks:[...selected].sort((a,b)=>a-b)});el("app").innerHTML=`<div class="loading"><h2>Bid submitted!</h2><p>Your selections have been added to the shared annual leave board.</p><p>You can close this page now.</p></div>`}catch(e){busy=false;el("submit").textContent="Submit my bid";const n=document.createElement("div");n.className="note error";n.textContent=e.message;el("app").insertBefore(n,el("app").querySelector(".tablewrap"));updateSelection()}}
(async()=>{if(!token){el("app").innerHTML='<div class="loading">This bidding link is incomplete. Please contact your supervisor.</div>';return}try{data=await call("get");render()}catch(e){el("app").innerHTML='<div class="loading"><h2>Link unavailable</h2><p>'+esc(e.message)+'</p>Please contact your supervisor.</div>'}})();
</script></body></html>
